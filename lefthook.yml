pre-commit:
  parallel: true
  commands:
    gitleaks:
      priority: 1
      run: gitleaks protect --staged --redact -v
    ruff-check:
      priority: 2
      glob: "*.py"
      run: uv run ruff check --fix {staged_files}
      stage_fixed: true
    ruff-format:
      priority: 3
      glob: "*.py"
      run: uv run ruff format {staged_files}
      stage_fixed: true
    nbstripout:
      priority: 4
      glob: "*.ipynb"
      run: uv run nbstripout {staged_files}
      stage_fixed: true
    large-files:
      priority: 5
      run: sh .githooks/check-large-files.sh

commit-msg:
  commands:
    strip-ai-trailers:
      run: sh .githooks/commit-msg {1}

pre-push:
  parallel: false
  commands:
    pyright:
      run: uv run pyright src
    deptry:
      run: uv run deptry src
    pytest:
      run: uv run pytest -m 'not slow'
