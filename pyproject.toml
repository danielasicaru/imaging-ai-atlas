[project]
name = "imaging-ai-atlas"
version = "0.1.0"
description = "How AI research in medical imaging has shifted over a decade: topic modeling of arXiv papers, told as a data story."
readme = "README.md"
license = "MIT"
authors = [{ name = "Daniela Sicaru" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    # pipeline
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15",
    "pyyaml>=6.0",
    "pydantic>=2.6",          # config validation (plain YAML + pydantic; revisit if Hydra is chosen)
    "typer>=0.12",            # per-stage CLI
    # embeddings and topics
    "torch==2.14.1",          # pinned exactly: CUDA wheel on Windows, CPU wheel on Linux CI (see
                               # [tool.uv.sources]/[tool.uv.index] below) — both must resolve the same version
    "sentence-transformers>=3.0",
    "safetensors>=0.4",
    "bertopic>=0.16",
    "umap-learn>=0.5.5",
    "hdbscan>=0.8.33",
    "scikit-learn>=1.4",
    # tracking, data versioning, story
    "mlflow>=2.12",
    "dvc>=3.50",
    "plotly>=5.20",
]

[project.scripts]
atlas = "imaging_ai_atlas.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "pyright>=1.1.380",
    "deptry>=0.20",
    "vulture>=2.11",
    "nbstripout>=0.7",
    "lefthook>=1.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# torch wheel source: CUDA on Windows (local RTX 2070, sm_75/Turing), CPU on Linux (CI has no GPU).
[tool.uv.sources]
torch = [
    { index = "pytorch-cu126", marker = "sys_platform == 'win32'" },
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.hatch.build.targets.wheel]
packages = ["src/imaging_ai_atlas"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle, pyflakes
    "I",             # import sorting
    "UP",            # pyupgrade
    "B",             # bugbear
    "SIM",           # simplify
    "S",             # security (bandit rules)
    "NPY",           # numpy-specific
    "PD",            # pandas-specific
    "RUF",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]   # assert is fine in tests

# ---------------------------------------------------------------- pyright
[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
reportMissingTypeStubs = false   # bertopic, umap-learn, hdbscan ship no type information
venvPath = "."
venv = ".venv"

# ---------------------------------------------------------------- pytest / coverage
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=imaging_ai_atlas --cov-report=term-missing"
markers = ["slow: needs model downloads or the full corpus; excluded from CI"]

[tool.coverage.run]
branch = true
source = ["imaging_ai_atlas"]

[tool.coverage.report]
fail_under = 80
skip_covered = true
exclude_lines = ["if __name__ == .__main__.:"]

# ---------------------------------------------------------------- dependency and dead-code hygiene
[tool.deptry]
known_first_party = ["imaging_ai_atlas"]

[tool.deptry.per_rule_ignores]
# DEP002 ("defined but unused"): pyarrow/dvc are CLI tools or implicit engines (pandas uses
# pyarrow under the hood for Parquet without a direct import), never imported by name.
# The rest are declared ahead of the pipeline stage that imports them, and the dev extras
# aren't imported by src/ at all. Shrink this list as each stage starts using its dependency.
DEP002 = [
    "pyarrow", "dvc",
    "torch", "bertopic",
    "umap-learn", "hdbscan", "scikit-learn", "plotly",
    "pytest", "pytest-cov", "ruff", "pyright", "deptry", "vulture", "nbstripout",
    "lefthook",
]

[tool.vulture]
paths = ["src"]
min_confidence = 80