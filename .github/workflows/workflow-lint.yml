name: Workflow lint

# Audits the workflows themselves (injection, over-broad permissions, unpinned actions).
# Findings go to the repository's Security tab rather than failing the run. Not run on
# pull requests: their read-only token can't upload findings.
on:
  push:
    branches: [main]
    paths: [".github/workflows/**"]
  workflow_dispatch:

permissions: {}

jobs:
  zizmor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
