name: Pages

# Publishes the README (home page), the reports, docs/pipeline.md and the ADRs as a
# static site. Requires Settings -> Pages -> Source: "GitHub Actions".
on:
  push:
    branches: [main]
    paths: [README.md, LICENSE, "reports/**", "docs/**", _config.yml, .github/workflows/pages.yml]
  workflow_dispatch:

permissions: {}

# One deployment at a time; let an in-progress one finish rather than cancel it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read # configure-pages reads the site's settings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Build from an explicit allowlist (the same files as the trigger paths above), so
      # nothing new at the repository root can end up on the site by accident.
      - run: mkdir site && cp -r README.md LICENSE _config.yml reports docs site/
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1.0.13
        with:
          source: ./site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
