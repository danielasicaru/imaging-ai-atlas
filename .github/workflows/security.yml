name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # weekly, Monday 06:00 UTC

permissions: {}

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0

  osv-scanner:
    if: github.event_name == 'schedule' || contains(github.event.head_commit.modified, 'requirements.lock.txt') || contains(github.event.head_commit.modified, 'uv.lock')
    permissions:
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@6ad84ce1ef2d4124ba333b221894c133c4a970ea # v2.7.0
    with:
      scan-args: |-
        --lockfile=requirements.txt:requirements.lock.txt

  actions-lint:
    if: contains(github.event.head_commit.modified, '.github/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
      - uses: reviewdog/action-actionlint@7f84fb71d0bac7cd2e0837cb1427fe3225f17a10 # v1.81.1
